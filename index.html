<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Vitalii Kmit (vitalii-code)</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <div id="root"></div>
    <div id="controls">
      <input type="text" id="search-input" placeholder="Search episodes..." />
      <select id="episode-select"></select>
    </div>

    <template id="episode-card">
      <article>
        <h1 class="title"></h1>
        <img class="thumb" />
        <p class="description"></p>
      </article>
    </template>

    <!-- Loads a provided function called getAllEpisodes() which returns all episodes -->
    <script src="episodes.js"></script>

    <!-- Loads YOUR javascript code -->
    <script src="script.js"></script>

    <div id="grid"></div>

    <footer>
      <p id="footer">
        The data on this website has (originally) come from
        <a href="TVMaze.com">TVMaze.com</a>
      </p>
    </footer>
  </body>
</html>
